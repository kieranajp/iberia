# A static site: no database, no secrets, nothing to configure at runtime.
# The datasets are baked into the image, so a rollback rolls the data back too.
app:
  replicaCount: 1
  image:
    repository: ghcr.io/kieranajp/iberia
    tag: latest
  service:
    # nginx-unprivileged listens high so the container needs no root.
    port: 8080
    type: ClusterIP
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"

ingress:
  enabled: true
  host: "iberia.kieranajp.uk"
