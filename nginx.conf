server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json application/geo+json text/css image/svg+xml;
    gzip_min_length 1024;

    # Filenames carry a content hash, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Datasets change with each release and are not hashed.
    location /data/ {
        types { application/geo+json geojson; }
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
