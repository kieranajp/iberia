name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v6

      # Deploy the artefact that was released, rather than rebuilding it here.
      # The site archive already contains the datasets, which are not in git, so
      # a rebuild would need to fetch them again and could differ from what was
      # tested and published.
      - name: Take the site from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern 'iberia-site-*.tar.gz' --dir .
          mkdir -p dist
          tar -xzf iberia-site-*.tar.gz -C dist
          test -f dist/index.html && test -d dist/data

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Write kubeconfig
        run: |
          echo '${{ secrets.KUBECONFIG }}' > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # Pinned for the same reason as the-bluer-book: Helm 4's kstatus --wait
          # reports plain ClusterIP Services as Unknown and times out.
          version: v3.21.0

      - name: Deploy with Helm
        run: |
          helm upgrade --install iberia ./charts/iberia \
            --namespace apps \
            --set app.image.tag="${{ github.event.release.tag_name }}" \
            --wait \
            --timeout 5m
